# Overrides for MAE-style masking with SynthSeg anatomy prediction only.
name: masked-anatomy
notes: Predict hidden-patch SynthSeg anatomy distributions; no image reconstruction loss.

objective: masked_anatomy
anatomy_vocabulary: src/data/synthseg_2_parc_vocabulary.json
model: masked_anatomy_vit_large
model_kwargs:
  # SynthSeg 2.0 --parc produces 98 non-background hard-label classes.
  num_anatomy_classes: 98

datasets:
  fomo_train:
    anatomy_key: anatomy.npz
  fomo_val:
    anatomy_key: anatomy.npz
